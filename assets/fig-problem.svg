  <text class="lab" x="94" y="203">3 distinct permutations in 3 replays; 17–20 distinct orders per 20 replays on two H100s.</text>
  <text class="panel" x="24" y="229">(b) silkern (either kernel)</text>
  <text class="mut" x="24" y="245">row-wide scan, or deterministic tile-prefix composition — no atomics</text>
