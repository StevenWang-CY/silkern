  <text class="mut" x="540" y="389">= the selector's order, every replay</text>
  <text class="noteB" x="110" y="464">1 permutation, always.<tspan class="mut" font-weight="400">&#160;&#160;Free-running generations were bitwise-identical across sessions.</tspan></text>
  <line class="sep" x1="24" y1="492" x2="876" y2="492"/>
  <text class="mut" x="24" y="514">Both converters return the same set and the same count; only the order differs. Shaded cells mark positions that changed relative to replay 1.</text>
  <text class="mut" x="24" y="532">Floating-point reduction is not associative, so a different consumption order is a different logit &#8212; and eventually a different token.</text>
