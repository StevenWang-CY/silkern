<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 444" width="900" height="444" role="img"
     aria-label="Three replays of byte-identical input. Panel a: the atomic converter returns three different orders, shaded where positions changed. Panel b: SILKern returns the selector's order every time. Both return the same set and count.">
