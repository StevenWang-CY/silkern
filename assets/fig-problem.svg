    .orange { fill: #eb6834; }
    .gray   { fill: #b3b2ab; }
    .blueS  { stroke: #2a78d6; }
    .orangeS{ stroke: #eb6834; }
    .marg { stroke: #cf3f36; stroke-width: 1; stroke-dasharray: 4 3; }
    .margT{ fill: #cf3f36; font-size: 10.5px; font-weight: 600; }
    .sep  { stroke: #dcdbd5; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .panel,.lab,.labB,.val { fill: #f0f0ee; }
      .mut  { fill: #91908a; }
      .drpv { fill: #6e6d67; }
      .axis,.tick { stroke: #f0f0ee; }
      .grid { stroke: #2c2c2a; }
      .cell { stroke: #6f6e68; }
      .drop { stroke: #4a4945; }
      .gray { fill: #55544e; }
      .blue { fill: #3987e5; } .blueS { stroke: #3987e5; }
      .orange { fill: #ee7a42; } .orangeS { stroke: #ee7a42; }
      .marg { stroke: #e66761; } .margT { fill: #e66761; }
      .sep  { stroke: #3a3a37; }
    }
  </style>
  <text class="labB" x="24" y="26">One selection row, byte-identical input, three CUDA-graph replays — the rank-local physical prefix each converter hands to attention</text>
  <text class="panel" x="24" y="58">(a) atomic reservation converter</text>
  <text class="mut" x="24" y="74">one atomic_add per 128-column tile, after a tile-local scan</text>
