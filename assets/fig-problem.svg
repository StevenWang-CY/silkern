  <text class="lab" x="94" y="374">1 permutation, always — and free-running generations were bitwise-identical across sessions.</text>
  <line class="sep" x1="24" y1="396" x2="876" y2="396"/>
  <text class="mut" x="24" y="414">Both converters return the same set and the same count; only the order differs. Shaded cells mark positions that changed relative to replay 1.</text>
  <text class="mut" x="24" y="429">Floating-point reduction is not associative, so a different consumption order is a different logit — and eventually a different token.</text>
</svg>
