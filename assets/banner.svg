<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img"
     aria-label="SILKern social banner: the weave mark and monoline wordmark over a faint thread motif, with the tagline 'Order, woven in.'">
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a78d6"/><stop offset="1" stop-color="#4a9be6"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eb6834"/><stop offset="1" stop-color="#f2914f"/>
    </linearGradient>
    <style>
      .b-ink   { fill: #0b0b0b; }
      .b-inkS  { stroke: #0b0b0b; }
      .b-softS { stroke: #454542; }
      .b-thread{ fill: none; stroke-width: 5.5; stroke-linecap: round; }
      .b-glyph { fill: none; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="#faf9f7"/>

  <!-- Faint background weave: the same three threads, at architectural scale. -->
  <g fill="none" stroke-linecap="round" stroke-width="26" opacity=".055">
    <path stroke="#0b0b0b" d="M -40 300 C 320 300, 440 470, 760 470 L 1320 470"/>
    <path stroke="#2a78d6" d="M -40 500 C 320 500, 440 130, 760 130 L 1320 130"/>
    <path stroke="#eb6834" d="M -40 110 C 320 110, 440 300, 760 300 L 1320 300"/>
  </g>

  <!-- Lockup: mark + monoline wordmark (identical geometry to logo-text.svg). -->
  <g transform="translate(268,140) scale(2)">
    <g transform="translate(6,26)">
      <path class="b-thread b-inkS"          d="M 6 48 C 30 48, 40 66, 62 66 L 82 66"/>
      <path class="b-thread" stroke="url(#gBlue)"   d="M 6 70 C 30 70, 40 30, 62 30 L 82 30"/>
      <path class="b-thread" stroke="url(#gOrange)" d="M 6 26 C 30 26, 40 48, 62 48 L 82 48"/>
      <rect class="b-ink" x="84" y="21" width="5.5" height="54" rx="2.75"/>
    </g>
    <g transform="translate(0,55)">
      <path class="b-glyph b-inkS" transform="translate(140,0)"
            d="M 21.5 7.5 C 19 3.2, 6.5 2.2, 4.5 9 C 2.6 15.8, 20.5 17.2, 21.6 25.8 C 22.6 33.8, 8 38.6, 3.2 32.4"/>
      <path class="b-glyph b-inkS" transform="translate(176,0)" d="M 3.5 3.5 V 36.5"/>
      <path class="b-glyph b-inkS" transform="translate(195,0)" d="M 3.5 3.5 V 36.5 H 19.5"/>
      <g transform="translate(227,0)">
        <path class="b-glyph" stroke="url(#gBlue)" d="M 31 1.5 C 24 9, 18 16, 5.5 24"/>
        <rect class="b-ink" x="0" y="0"     width="9" height="8" rx="2.2"/>
        <rect class="b-ink" x="0" y="10.67" width="9" height="8" rx="2.2"/>
        <rect class="b-ink" x="0" y="21.33" width="9" height="8" rx="2.2"/>
        <rect class="b-ink" x="0" y="32"    width="9" height="8" rx="2.2"/>
        <path class="b-glyph" stroke="url(#gOrange)" d="M 5.5 23.5 C 14 29, 25 34.5, 31.5 38.5"/>
      </g>
      <path class="b-glyph b-softS" transform="translate(273,0)"
            d="M 3.6 25 H 20.4 C 20.4 13.6, 3.6 13.6, 3.6 25.4 C 3.6 34.2, 12.4 38.4, 20 33"/>
      <g transform="translate(309,0)">
        <path class="b-glyph b-softS" d="M 3.5 15.5 V 36.5"/>
        <path class="b-glyph b-softS" d="M 3.5 23 C 4.6 16.6, 11.5 14, 16.5 16"/>
      </g>
      <g transform="translate(334,0)">
        <path class="b-glyph b-softS" d="M 3.5 15.5 V 36.5"/>
        <path class="b-glyph b-softS" d="M 3.5 21.5 C 5.5 15, 18.5 13.6, 18.5 23.5 V 36.5"/>
      </g>
    </g>
    <g class="b-ink" fill-opacity=".28">
      <rect x="147.5" y="103" width="10" height="2.5" rx="1.25"/>
      <rect x="174.5" y="103" width="10" height="2.5" rx="1.25"/>
      <rect x="201.5" y="103" width="10" height="2.5" rx="1.25"/>
      <rect x="238.5" y="103" width="10" height="2.5" rx="1.25"/>
      <rect x="280"   y="103" width="10" height="2.5" rx="1.25"/>
      <rect x="307.5" y="103" width="10" height="2.5" rx="1.25"/>
      <rect x="340"   y="103" width="10" height="2.5" rx="1.25"/>
    </g>
    <text fill="#0b0b0b" fill-opacity=".58" font-weight="600" font-size="11.5" letter-spacing="2.2"
          font-family='-apple-system, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif'
          x="248" y="130" text-anchor="middle">SPARSE-INDEX LOCALIZATION KERNELS</text>
  </g>

  <text fill="#0b0b0b" fill-opacity=".85" font-size="30" letter-spacing=".5" x="640" y="482" text-anchor="middle"
        font-family='-apple-system, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif'>Order, woven in.</text>
  <text fill="#0b0b0b" fill-opacity=".4" font-size="17" x="640" y="566" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">github.com/StevenWang-CY/silkern</text>
</svg>
