<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img"
     aria-label="SILKern mark: three index threads enter scattered, weave once, and exit as parallel ordered strands into a prefix rail.">
  <style>
    .ink   { fill: #0b0b0b; }
    .soft  { fill: #43423f; }
    .sub   { fill: #0b0b0b; fill-opacity: .55; }
    .inkS  { stroke: #0b0b0b; }
    .thread{ fill: none; stroke-width: 5.2; stroke-linecap: round; }
    .kbB { fill: #2a78d6; }
    .kbO { fill: #eb6834; }
    .kb  { animation: kbin .45s cubic-bezier(.3,0,.4,1) both; }
    @keyframes kbin { from { opacity: 0; } to { opacity: 1; } }
    .draw   { stroke-dasharray: 100; stroke-dashoffset: 0; animation: weave 1.5s cubic-bezier(.55,0,.2,1) both; }
    @keyframes weave { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .draw, .kb { animation: none; } }
    @media (prefers-color-scheme: dark) {
      .ink  { fill: #f2f2f0; }
      .soft { fill: #c9c9c6; }
      .kbB  { fill: #3987e5; }
      .kbO  { fill: #ee7a42; }
      .sub  { fill: #f2f2f0; }
      .inkS { stroke: #f2f2f0; }
    }
  </style>
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a78d6"/><stop offset="1" stop-color="#4a9be6"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eb6834"/><stop offset="1" stop-color="#f2914f"/>
    </linearGradient>
  </defs>
  <g>
    <path class="thread inkS draw" pathLength="100" d="M 8 48 H 17 C 36 48, 45 66, 63 66 H 82"/>
    <path class="thread draw" pathLength="100" style="animation-delay:.1s" stroke="url(#gBlue)"   d="M 8 70 H 17 C 36 70, 45 30, 63 30 H 82"/>
    <path class="thread draw" pathLength="100" style="animation-delay:.2s" stroke="url(#gOrange)" d="M 8 26 H 17 C 36 26, 45 48, 63 48 H 82"/>
    <rect class="ink" x="84" y="22" width="5.2" height="52" rx="2.6"/>
  </g>
</svg>
