<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img"
     aria-label="SILKern mark: three index threads enter scattered, weave once, and exit as parallel ordered strands into a prefix rail.">
  <style>
    .ink   { fill: #0b0b0b; }
    .soft  { fill: #43423f; }
    .sub   { fill: #0b0b0b; fill-opacity: .55; }
    .inkS  { stroke: #0b0b0b; }
    .thread{ fill: none; stroke-width: 5.2; stroke-linecap: round; }
    .kblue  { fill: none; stroke: url(#gBlue);   stroke-width: 7; stroke-linecap: round; }
    .korange{ fill: none; stroke: url(#gOrange); stroke-width: 7; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .ink  { fill: #f2f2f0; }
      .soft { fill: #c9c9c6; }
      .sub  { fill: #f2f2f0; }
      .inkS { stroke: #f2f2f0; }
    }
  </style>
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a78d6"/><stop offset="1" stop-color="#4a9be6"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eb6834"/><stop offset="1" stop-color="#f2914f"/>
    </linearGradient>
  </defs>
  <g>
    <path class="thread inkS" d="M 8 48 H 17 C 36 48, 45 66, 63 66 H 82"/>
    <path class="thread" stroke="url(#gBlue)"   d="M 8 70 H 17 C 36 70, 45 30, 63 30 H 82"/>
    <path class="thread" stroke="url(#gOrange)" d="M 8 26 H 17 C 36 26, 45 48, 63 48 H 82"/>
    <rect class="ink" x="84" y="22" width="5.2" height="52" rx="2.6"/>
  </g>
</svg>
