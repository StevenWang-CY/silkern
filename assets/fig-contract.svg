<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img"
     aria-label="The localization contract in five stages with one worked example: request routing, ownership filter, deinterleave, paged translation, stable front compaction, ending in physical prefix 708 129 451 with exact count 3.">
  <style>
    text  { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .panel{ fill: #0b0b0b; font-size: 13px; font-weight: 700; }
    .lab  { fill: #0b0b0b; font-size: 11.5px; }
    .labB { fill: #0b0b0b; font-size: 11.5px; font-weight: 600; }
    .mut  { fill: #77766f; font-size: 10.5px; }
    .val  { fill: #0b0b0b; font-size: 12px; }
    .drpv { fill: #a5a49d; font-size: 12px; }
    .axis { stroke: #0b0b0b; stroke-width: 1; }
    .tick { stroke: #0b0b0b; stroke-width: 1; }
    .grid { stroke: #e6e5df; stroke-width: 1; }
    .cell { fill: none; stroke: #9a9992; stroke-width: 1; }
    .drop { fill: none; stroke: #c6c5be; stroke-width: 1; stroke-dasharray: 3 2.5; }
    .blue   { fill: #2a78d6; }
    .orange { fill: #eb6834; }
    .gray   { fill: #b3b2ab; }
    .blueS  { stroke: #2a78d6; }
    .orangeS{ stroke: #eb6834; }
    .marg { stroke: #cf3f36; stroke-width: 1; stroke-dasharray: 4 3; }
    .margT{ fill: #cf3f36; font-size: 10.5px; font-weight: 600; }
    .sep  { stroke: #dcdbd5; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .panel,.lab,.labB,.val { fill: #f0f0ee; }
      .mut  { fill: #91908a; }
      .drpv { fill: #6e6d67; }
      .axis,.tick { stroke: #f0f0ee; }
      .grid { stroke: #2c2c2a; }
      .cell { stroke: #6f6e68; }
      .drop { stroke: #4a4945; }
      .gray { fill: #55544e; }
      .blue { fill: #3987e5; } .blueS { stroke: #3987e5; }
      .orange { fill: #ee7a42; } .orangeS { stroke: #ee7a42; }
      .marg { stroke: #e66761; } .margT { fill: #e66761; }
      .sep  { stroke: #3a3a37; }
    }
  </style>
  <text class="labB" x="24" y="26">The localization contract — one row worked through all five stages</text>
  <text class="mut mono" x="24" y="43">dcp_size=2   dcp_rank=0   interleave=1   block_size=64   request=3</text>
  <text class="labB" x="24" y="74">input</text>
  <text class="mut" x="24" y="89">global logical positions, selector order</text>
  <rect class="cell" x="24" y="97" width="50" height="24"/>
  <text class="val mono" x="49.0" y="113.5" text-anchor="middle">8</text>
  <rect class="cell" x="79" y="97" width="50" height="24"/>
  <text class="val mono" x="104.0" y="113.5" text-anchor="middle">5</text>
  <rect class="cell" x="134" y="97" width="50" height="24"/>
  <text class="val mono" x="159.0" y="113.5" text-anchor="middle">130</text>
  <rect class="cell" x="189" y="97" width="50" height="24"/>
  <text class="val mono" x="214.0" y="113.5" text-anchor="middle">7</text>
  <rect class="cell" x="244" y="97" width="50" height="24"/>
  <text class="val mono" x="269.0" y="113.5" text-anchor="middle">-1</text>
  <rect class="cell" x="299" y="97" width="50" height="24"/>
  <text class="val mono" x="324.0" y="113.5" text-anchor="middle">262</text>
  <text class="labB" x="560" y="74">page table</text>
  <text class="mut" x="560" y="89"><tspan class="mono">block_table[3]</tspan> — fragmented, per request; used in stage 4</text>
  <rect class="cell" x="560" y="97" width="50" height="24"/>
  <text class="val mono" x="585.0" y="113.5" text-anchor="middle">11</text>
  <rect class="cell" x="615" y="97" width="50" height="24"/>
  <text class="val mono" x="640.0" y="113.5" text-anchor="middle">2</text>
  <rect class="cell" x="670" y="97" width="50" height="24"/>
  <text class="val mono" x="695.0" y="113.5" text-anchor="middle">7</text>
  <rect class="cell" x="725" y="97" width="50" height="24"/>
  <text class="val mono" x="750.0" y="113.5" text-anchor="middle">5</text>
  <text class="mut mono" x="585" y="139" text-anchor="middle">blk0</text><text class="mut mono" x="640" y="139" text-anchor="middle">blk1</text><text class="mut mono" x="695" y="139" text-anchor="middle">blk2</text><text class="mut mono" x="750" y="139" text-anchor="middle">blk3</text>
  <line class="axis" x1="180" y1="129" x2="180" y2="147"/><path class="axis" fill="none" d="M 176 143 L 180 148 L 184 143"/>
  <text class="labB" x="24" y="172">stages 1–2 · route to the request, drop what this rank does not own</text>
  <text class="mut mono" x="24" y="187">owner = (token // interleave) % dcp_size ; negatives invalid</text>
  <rect class="cell" x="24" y="195" width="50" height="24"/>
  <text class="val mono" x="49.0" y="211.5" text-anchor="middle">8</text>
  <rect class="drop" x="79" y="195" width="50" height="24"/>
  <text class="drpv mono" x="104.0" y="211.5" text-anchor="middle">5</text>
  <rect class="cell" x="134" y="195" width="50" height="24"/>
  <text class="val mono" x="159.0" y="211.5" text-anchor="middle">130</text>
  <rect class="drop" x="189" y="195" width="50" height="24"/>
  <text class="drpv mono" x="214.0" y="211.5" text-anchor="middle">7</text>
  <rect class="drop" x="244" y="195" width="50" height="24"/>
  <text class="drpv mono" x="269.0" y="211.5" text-anchor="middle">-1</text>
  <rect class="cell" x="299" y="195" width="50" height="24"/>
  <text class="val mono" x="324.0" y="211.5" text-anchor="middle">262</text>
  <text class="mut" x="49" y="237" text-anchor="middle"> </text>
  <g class="mut" text-anchor="middle" font-size="10"><text x="129" y="237">rank 1</text><text x="239" y="237">rank 1</text><text x="294" y="237">invalid</text></g>
  <line class="axis" x1="180" y1="227" x2="180" y2="245"/><path class="axis" fill="none" d="M 176 241 L 180 246 L 184 241"/>
  <text class="labB" x="24" y="270">stage 3 · deinterleave to this rank's local index space</text>
  <text class="mut mono" x="24" y="285">local = (token // (dcp_size*interleave)) * interleave + token % interleave</text>
  <rect class="cell" x="24" y="293" width="50" height="24"/>
  <text class="val mono" x="49.0" y="309.5" text-anchor="middle">4</text>
  <rect class="cell" x="79" y="293" width="50" height="24"/>
  <text class="val mono" x="104.0" y="309.5" text-anchor="middle">65</text>
  <rect class="cell" x="134" y="293" width="50" height="24"/>
  <text class="val mono" x="159.0" y="309.5" text-anchor="middle">131</text>
  <g class="mut mono" text-anchor="middle" font-size="10"><text x="49" y="335">blk0·off4</text><text x="104" y="335">blk1·off1</text><text x="159" y="335">blk2·off3</text></g>
  <line class="axis" x1="224" y1="325" x2="224" y2="343"/><path class="axis" fill="none" d="M 220 339 L 224 344 L 228 339"/>
  <text class="labB" x="24" y="368">stages 4–5 · translate through the page table, compact to a front prefix in input order</text>
  <text class="mut mono" x="24" y="383">physical = block_table[blk] * block_size + off ; survivors keep relative order, tail = -1</text>
  <rect class="cell" x="24" y="391" width="50" height="24"/>
  <text class="val mono" x="49.0" y="407.5" text-anchor="middle">708</text>
  <rect class="cell" x="79" y="391" width="50" height="24"/>
  <text class="val mono" x="104.0" y="407.5" text-anchor="middle">129</text>
  <rect class="cell" x="134" y="391" width="50" height="24"/>
  <text class="val mono" x="159.0" y="407.5" text-anchor="middle">451</text>
  <rect class="drop" x="189" y="391" width="50" height="24"/>
  <text class="drpv mono" x="214.0" y="407.5" text-anchor="middle">-1</text>
  <rect class="drop" x="244" y="391" width="50" height="24"/>
  <text class="drpv mono" x="269.0" y="407.5" text-anchor="middle">-1</text>
  <rect class="drop" x="299" y="391" width="50" height="24"/>
  <text class="drpv mono" x="324.0" y="407.5" text-anchor="middle">-1</text>
  <text class="labB mono" x="380" y="407">count = 3</text>
  <text class="mut" x="380" y="421">exact, not an upper bound</text>
  <line class="sep" x1="24" y1="437" x2="876" y2="437"/>
  <text class="mut" x="24" y="455">The reference oracle defines every stage in pure Python; both GPU kernels must reproduce it elementwise — set, count, and order.</text>
</svg>
