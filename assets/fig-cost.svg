<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" role="img"
     aria-label="Converter segment time: row-wide 120 microseconds, atomic baseline 194, hierarchical 239. Complete decode step ratios versus the atomic baseline: row-wide at 32K is 1.000031 with interval 0.997373 to 1.002696; hierarchical at 32K is 1.000580; hierarchical at 64K is 1.002178; row-wide at 64K is 1.014006 with interval 1.010326 to 1.017700, which exceeds the 1.01 margin.">
  <style>
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .h1   { fill: #0b0b0b; font-size: 19px; font-weight: 650; }
    .h2   { fill: #0b0b0b; font-size: 15px; font-weight: 620; }
    .val  { fill: #0b0b0b; font-size: 13px; font-weight: 620; }
    .lab  { fill: #0b0b0b; font-size: 12.5px; }
    .body { fill: #52514e; font-size: 12.5px; }
    .mute { fill: #86857f; font-size: 11.5px; }
    .rule { stroke: #dcdbd5; stroke-width: 1; }
    .grid { stroke: #e8e7e2; stroke-width: 1; }
    .base { stroke: #b8b7b0; stroke-width: 1.5; }

    .row  { fill: #2a78d6; }
    .atm  { fill: #eb6834; }
    .hier { fill: #1baf7a; }
    .rowS { stroke: #2a78d6; }
    .hierS{ stroke: #1baf7a; }
    .margin { stroke: #e34948; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .marginT{ fill: #e34948; font-size: 11.5px; font-weight: 620; }

    @media (prefers-color-scheme: dark) {
      .h1, .h2, .val, .lab { fill: #ffffff; }
      .body { fill: #c3c2b7; }
      .mute { fill: #91908a; }
      .rule { stroke: #3a3a37; }
      .grid { stroke: #2c2c2a; }
      .base { stroke: #55544f; }
      .row  { fill: #3987e5; } .rowS  { stroke: #3987e5; }
      .atm  { fill: #d95926; }
      .hier { fill: #199e70; } .hierS { stroke: #199e70; }
      .margin { stroke: #e66767; } .marginT { fill: #e66767; }
    }
  </style>

  <text class="h1" x="24" y="28">What determinism costs</text>
  <text class="body" x="24" y="50">Two views of the same five sessions on two H100s. Left: the converter alone. Right: the complete 48-layer decode step.</text>
  <line class="rule" x1="24" y1="66" x2="876" y2="66"/>

  <!-- ================= LEFT: converter segment ================= -->
  <text class="h2" x="24" y="96">Converter segment</text>
  <text class="mute" x="24" y="114">µs per graph replay, timed in isolation. Lower is better.</text>

  <!-- scale: 0..260 µs mapped to x 140..322 (0.7 px per µs) -->
  <line class="base" x1="140" y1="132" x2="140" y2="250"/>
  <line class="grid" x1="210" y1="132" x2="210" y2="250"/>
  <line class="grid" x1="280" y1="132" x2="280" y2="250"/>
  <g class="mute" text-anchor="middle"><text x="140" y="284">0</text><text x="210" y="284">100</text><text x="280" y="284">200 µs</text></g>

  <text class="lab" x="130" y="154" text-anchor="end">row-wide</text>
  <rect class="row" x="140" y="140" width="84" height="20" rx="4"/>
  <text class="val" x="234" y="155">120 µs</text>

  <text class="lab" x="130" y="192" text-anchor="end">atomic</text>
  <rect class="atm" x="140" y="178" width="136" height="20" rx="4"/>
  <text class="val" x="286" y="193">194 µs</text>

  <text class="lab" x="130" y="230" text-anchor="end">hierarchical</text>
  <rect class="hier" x="140" y="216" width="167" height="20" rx="4"/>
  <text class="val" x="317" y="231">239 µs</text>

  <text class="h2" x="24" y="308">The deterministic converter is the cheap one.</text>
  <text class="body" x="24" y="329">Row-wide does the atomic baseline's work in <tspan class="mono">38%</tspan> less</text>
  <text class="body" x="24" y="347">time: one launch, one row-wide scan, no atomic traffic.</text>
  <text class="body" x="24" y="365">Hierarchical buys a bounded per-program working set</text>
  <text class="body" x="24" y="383">with four launches — and earns it back at 64K.</text>

  <!-- ================= RIGHT: complete step ================= -->
  <text class="h2" x="420" y="96">Complete decode step</text>
  <text class="mute" x="420" y="114">ratio vs. the atomic baseline. 1.00 = free.</text>

  <!-- scale: 0.99..1.02 mapped to x 540..800 -->
  <line class="grid" x1="540" y1="132" x2="540" y2="250"/>
  <line class="base" x1="627" y1="128" x2="627" y2="254"/>
  <line class="margin" x1="713" y1="128" x2="713" y2="254"/>
  <g class="mute" text-anchor="middle">
    <text x="540" y="284">0.99</text><text x="627" y="284">1.00</text><text x="800" y="284">1.02</text>
  </g>
  <text class="marginT" x="713" y="122" text-anchor="middle">1.01 margin, fixed in advance</text>

  <!-- row-wide 32K: 1.000031 [0.997373, 1.002696] -->
  <text class="lab" x="530" y="152" text-anchor="end">row-wide · 32K</text>
  <line class="rowS" x1="604" y1="147" x2="650" y2="147" stroke-width="2.5" stroke-linecap="round"/>
  <circle class="row" cx="627" cy="147" r="5"/>
  <text class="val mono" x="876" y="151" text-anchor="end">1.00003</text>
  <text class="mute" x="530" y="167" text-anchor="end">primary endpoint</text>

  <!-- hierarchical 32K: 1.000580 [0.997800, 1.003368] -->
  <text class="lab" x="530" y="192" text-anchor="end">hierarchical · 32K</text>
  <line class="hierS" x1="607" y1="187" x2="656" y2="187" stroke-width="2.5" stroke-linecap="round"/>
  <circle class="hier" cx="631" cy="187" r="5"/>
  <text class="val mono" x="876" y="191" text-anchor="end">1.00058</text>

  <!-- hierarchical 64K: 1.002178 [0.995750, 1.008648] -->
  <text class="lab" x="530" y="222" text-anchor="end">hierarchical · 64K</text>
  <line class="hierS" x1="590" y1="217" x2="702" y2="217" stroke-width="2.5" stroke-linecap="round"/>
  <circle class="hier" cx="645" cy="217" r="5"/>
  <text class="val mono" x="876" y="221" text-anchor="end">1.00218</text>

  <!-- row-wide 64K: 1.014006 [1.010326, 1.017700] -->
  <text class="lab" x="530" y="252" text-anchor="end">row-wide · 64K</text>
  <line class="rowS" x1="716" y1="247" x2="779" y2="247" stroke-width="2.5" stroke-linecap="round"/>
  <circle class="row" cx="747" cy="247" r="5"/>
  <text class="val mono" x="876" y="251" text-anchor="end">1.01401</text>
  <text class="marginT" x="530" y="267" text-anchor="end">a real cost, disclosed</text>

  <text class="h2" x="420" y="308">Free at 32K. Not free everywhere.</text>
  <text class="body" x="420" y="329">Three of the four contrasts sit on 1.00. The fourth does not:</text>
  <text class="body" x="420" y="347">the row-wide arm at 64K is <tspan class="mono">1.4%</tspan> slower, reproduced in all five</text>
  <text class="body" x="420" y="365">sessions, arising downstream of its unchanged converter.</text>
  <text class="body" x="420" y="383">Use <tspan class="mono">localize_hierarchical</tspan> at long context.</text>

  <line class="rule" x1="24" y1="410" x2="876" y2="410"/>
  <text class="body" x="24" y="434">Five fresh two-process sessions, randomized paired blocks, 98.75% simultaneous intervals over the four-contrast family. Measured on a</text>
  <text class="body" x="24" y="452">single-purpose reference executor, not a serving runtime under load: its capture-safe dense-weighted mixture-of-experts inflates the</text>
  <text class="body" x="24" y="470">per-step denominator identically for every arm. Every number here is in <tspan class="mono">evidence/05-full-decode-canary/analysis.json</tspan>.</text>
</svg>
