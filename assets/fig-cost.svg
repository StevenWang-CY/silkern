<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 348" width="900" height="348" role="img"
     aria-label="Panel a: converter segment time - row-wide 120.0 microseconds, atomic 194.4, hierarchical 239.7. Panel b: forest plot of complete decode step ratios versus the atomic baseline with 98.75 percent intervals; row-wide 32K 1.000031, hierarchical 32K 1.000580, hierarchical 64K 1.002178, all within the prespecified 1.01 margin; row-wide 64K 1.014006 exceeds it.">
  <style>
