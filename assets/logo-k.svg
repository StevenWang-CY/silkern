<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img"
     aria-label="SILKern K icon: the wordmark's K alone - typeset ink stem, blue kernel thread behind it, orange kernel thread in front. K for kernels, and for top-k.">
  <style>
    .ink   { fill: #0b0b0b; }
    .soft  { fill: #43423f; }
    .sub   { fill: #0b0b0b; fill-opacity: .55; }
    .inkS  { stroke: #0b0b0b; }
    .thread{ fill: none; stroke-width: 5.2; stroke-linecap: round; }
    .kbB { fill: #2a78d6; }
    .kbO { fill: #eb6834; }
    .kb  { animation: kbin .45s cubic-bezier(.3,0,.4,1) both; }
    @keyframes kbin { from { opacity: 0; } to { opacity: 1; } }
    .draw   { stroke-dasharray: 100; stroke-dashoffset: 0; animation: weave 1.5s cubic-bezier(.55,0,.2,1) both; }
    @keyframes weave { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .draw, .kb { animation: none; } }
    @media (prefers-color-scheme: dark) {
      .ink  { fill: #f2f2f0; }
      .soft { fill: #c9c9c6; }
      .kbB  { fill: #3987e5; }
      .kbO  { fill: #ee7a42; }
      .sub  { fill: #f2f2f0; }
      .inkS { stroke: #f2f2f0; }
    }
  </style>
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a78d6"/><stop offset="1" stop-color="#4a9be6"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eb6834"/><stop offset="1" stop-color="#f2914f"/>
    </linearGradient>
  </defs>
  <g transform="translate(17,82) scale(1.62)">
    <g transform="translate(0,0)"><rect class="ink kb" style="animation-delay:0.00s" x="4.44" y="-40" width="7.56" height="8.65" rx="1.2"/><rect class="ink kb" style="animation-delay:0.07s" x="4.44" y="-29.55" width="7.56" height="8.65" rx="1.2"/><rect class="ink kb" style="animation-delay:0.14s" x="4.44" y="-19.1" width="7.56" height="8.65" rx="1.2"/><rect class="ink kb" style="animation-delay:0.21s" x="4.44" y="-8.65" width="7.56" height="8.65" rx="1.2"/><g transform="translate(30.28,-36.23) rotate(136.1)"><rect class="kb kbB" style="animation-delay:0.30s" x="-2.80" y="-3.45" width="5.6" height="6.9" rx="1.8"/></g><g transform="translate(25.25,-31.55) rotate(138.3)"><rect class="kb kbB" style="animation-delay:0.39s" x="-2.80" y="-3.45" width="5.6" height="6.9" rx="1.8"/></g><g transform="translate(20.23,-27.31) rotate(141.5)"><rect class="kb kbB" style="animation-delay:0.48s" x="-2.80" y="-3.45" width="5.6" height="6.9" rx="1.8"/></g><g transform="translate(15.60,-23.89) rotate(145.8)"><rect class="kb kbB" style="animation-delay:0.57s" x="-2.80" y="-3.45" width="5.6" height="6.9" rx="1.8"/></g><g transform="translate(15.76,-16.54) rotate(33.2)"><rect class="kb kbO" style="animation-delay:0.66s" x="-2.80" y="-3.45" width="5.6" height="6.9" rx="1.8"/></g><g transform="translate(20.81,-12.98) rotate(37.0)"><rect class="kb kbO" style="animation-delay:0.75s" x="-2.80" y="-3.45" width="5.6" height="6.9" rx="1.8"/></g><g transform="translate(26.03,-8.77) rotate(40.9)"><rect class="kb kbO" style="animation-delay:0.84s" x="-2.80" y="-3.45" width="5.6" height="6.9" rx="1.8"/></g><g transform="translate(30.86,-4.28) rotate(45.0)"><rect class="kb kbO" style="animation-delay:0.93s" x="-2.80" y="-3.45" width="5.6" height="6.9" rx="1.8"/></g></g>
  </g>
</svg>
