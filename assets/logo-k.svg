<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img"
     aria-label="SILKern K icon: the wordmark's K alone - typeset ink stem, blue kernel thread behind it, orange kernel thread in front. K for kernels, and for top-k.">
  <style>
    .ink   { fill: #0b0b0b; }
    .soft  { fill: #43423f; }
    .sub   { fill: #0b0b0b; fill-opacity: .55; }
    .inkS  { stroke: #0b0b0b; }
    .thread{ fill: none; stroke-width: 5.2; stroke-linecap: round; }
    .kblue  { fill: none; stroke: url(#gBlue);   stroke-width: 7; stroke-linecap: round; }
    .korange{ fill: none; stroke: url(#gOrange); stroke-width: 7; stroke-linecap: round; }
    .draw   { stroke-dasharray: 100; stroke-dashoffset: 0; animation: weave 1.5s cubic-bezier(.55,0,.2,1) both; }
    @keyframes weave { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .draw { animation: none; } }
    @media (prefers-color-scheme: dark) {
      .ink  { fill: #f2f2f0; }
      .soft { fill: #c9c9c6; }
      .sub  { fill: #f2f2f0; }
      .inkS { stroke: #f2f2f0; }
    }
  </style>
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a78d6"/><stop offset="1" stop-color="#4a9be6"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eb6834"/><stop offset="1" stop-color="#f2914f"/>
    </linearGradient>
  </defs>
  <g transform="translate(17,82) scale(1.62)">
    <g transform="translate(0,0)"><path class="kblue draw" pathLength="100" style="animation-delay:.3s" d="M 31.6 -37.2 C 24.5 -30.5, 17 -25.2, 7.4 -22.6"/><rect class="ink" x="4.44" y="-40.0" width="7.56" height="4.6" rx="1.0"/><rect class="ink" x="4.44" y="-34.1" width="7.56" height="4.6" rx="1.0"/><rect class="ink" x="4.44" y="-28.2" width="7.56" height="4.6" rx="1.0"/><rect class="ink" x="4.44" y="-22.3" width="7.56" height="4.6" rx="1.0"/><rect class="ink" x="4.44" y="-16.4" width="7.56" height="4.6" rx="1.0"/><rect class="ink" x="4.44" y="-10.5" width="7.56" height="4.6" rx="1.0"/><rect class="ink" x="4.44" y="-4.6" width="7.56" height="4.6" rx="1.0"/><path class="korange draw" pathLength="100" style="animation-delay:.42s" d="M 8.2 -20.6 C 17.5 -15.5, 26.5 -8.5, 32.6 -2.6"/></g>
  </g>
</svg>
