[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "silkern"
version = "0.1.0"
description = "SILKern: sparse-index localization kernels for context-parallel decode - deterministic, allocation-free, CUDA-graph-safe"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "sparse-attention",
    "context-parallelism",
    "determinism",
    "cuda-graphs",
    "triton",
    "llm-inference",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
# The contract and the oracle are pure Python by design: `pip install silkern`
# works on a laptop, and the GPU stack is opt-in.
dependencies = []

[project.optional-dependencies]
gpu = ["torch>=2.4", "triton>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/StevenWang-CY/SILKern."
Repository = "https://github.com/StevenWang-CY/SILKern."
Issues = "https://github.com/StevenWang-CY/SILKern./issues"
Evidence = "https://github.com/StevenWang-CY/SILKern./tree/main/evidence"

[project.scripts]
silkern-verify = "silkern.verify:main"

[tool.hatch.build.targets.wheel]
packages = ["silkern"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA device and Triton (deselect with -m 'not gpu')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The Triton kernels are carried verbatim from the qualified implementation.
# Reformatting them would invalidate the recorded conformance evidence.
"silkern/kernels.py" = ["E741"]
# Tests reach into private helpers on purpose: the harness's independent order
# derivation is exactly what needs its own test.
"tests/test_verify.py" = ["E402"]
